# 检查与发布（GitHub Pages：Settings → Pages 的 Source 为 GitHub Actions）。
# - 所有 PR（任何 base）和推送 main：安装 → 构建 → 自动测试。PR 只检查，不部署、不需要部署权限。
# - 只有推送 main（或在 main 上手动运行）且测试通过后，才发布。
# - PR 的重复运行可以互相取消；main 的运行和部署永远不会被取消。
name: Test and deploy
on:
  push:
    branches: [main]
  pull_request:   # 所有 PR 都跑测试（包括 base 不是 main 的叠加 PR）；PR 永远不部署
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  diag:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: step3 诊断循环（只为取证，不是正式测试）
        run: |
          pass=0; fail=0
          for i in 1 2 3 4 5 6; do
            if node tests/step3-diag.test.mjs > /tmp/s3-$i.log 2>&1; then pass=$((pass+1)); else fail=$((fail+1)); echo "##### iter $i FAILED"; grep -A120 'DIAG reload' /tmp/s3-$i.log | head -150; grep -n '❌' /tmp/s3-$i.log | head; fi
          done
          echo "shard ${{ matrix.shard }}: pass=$pass fail=$fail"
