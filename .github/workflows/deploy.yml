# 检查与发布（GitHub Pages：Settings → Pages 的 Source 为 GitHub Actions）。
# - 所有 PR（任何 base）和推送 main：安装 → 构建 → 自动测试。PR 只检查，不部署、不需要部署权限。
# - 只有推送 main（或在 main 上手动运行）且测试通过后，才发布；发布的是去掉测试页（access-test.html、lab.html 等）的 dist-pages。
# - PR 的重复运行可以互相取消；main 的运行和部署永远不会被取消。
name: Test and deploy
on:
  push:
    branches: [main]
  pull_request:   # 所有 PR 都跑测试（包括 base 不是 main 的叠加 PR）；PR 永远不部署
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: 用真实 Python 验证题目答案
        run: npm run verify:content
      - run: npm run build
      - name: 自动测试（不通过就不部署）
        run: npm test
      - name: 生成发布内容并自检（测试页 access-test.html / lab.html 等只留在仓库和测试用的 dist，不发布；PR 也跑）
        run: node scripts/make-pages-artifact.mjs dist dist-pages
      - name: 上传发布文件（只有 main 上传；上传的是去掉测试页的 dist-pages）
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist-pages
  mobile:
    # 手机模拟测试：WebKit（Safari 内核）和 Chromium 两个内核都必须通过，PR 必跑，也是部署前提。
    # 是 Playwright 模拟，不等于 iOS 真机 / 微信 / iPad；不测 VoiceOver。
    # 依赖功能缺失 → 测试失败；浏览器装不上或起不来 → “环境失败”（同样是失败，不会当作通过）。不使用 continue-on-error。
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit, chromium]
    name: mobile (${{ matrix.browser }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 安装浏览器和系统依赖
        id: install
        # runner 偶发 apt 解析不到 ubuntu 镜像（2026-11-12 实际发生：Temporary failure resolving）。只重试安装本身，最多 4 次，间隔递增；
        # 4 次都失败仍然失败（报“环境失败”），不跳过浏览器、不算通过。
        run: |
          for i in 1 2 3 4; do
            npx playwright install --with-deps ${{ matrix.browser }} && exit 0
            echo "::warning::安装第 $i 次失败，$((i*30)) 秒后重试"; sudo apt-get clean || true; sleep $((i*30))
          done
          exit 1
      - run: npm run build
      - name: 手机模拟测试（${{ matrix.browser }}）
        id: mobile
        run: npm run test:mobile -- ${{ matrix.browser }}
      - name: 端到端关键流程（${{ matrix.browser }}）：开场 → 打开课程 → 运行 Python → 答题保存 → 刷新恢复；PWA 清单 / 图标 / 代码题按需加载
        id: e2e
        run: npm run test:e2e -- ${{ matrix.browser }}
      - name: 报告环境失败
        if: failure() && steps.install.outcome == 'failure'
        run: echo "::error title=环境失败::${{ matrix.browser }} 安装失败，这不是测试通过" && exit 1
  deploy:
    needs: [build, mobile]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
