# 检查与发布（GitHub Pages：Settings → Pages 的 Source 为 GitHub Actions）。
# - 所有 PR（任何 base）和推送 main：安装 → 构建 → 自动测试。PR 只检查，不部署、不需要部署权限。
# - 只有推送 main（或在 main 上手动运行）且测试通过后，才发布。
# - PR 的重复运行可以互相取消；main 的运行和部署永远不会被取消。
name: Test and deploy
on:
  push:
    branches: [main]
  pull_request:   # 所有 PR 都跑测试（包括 base 不是 main 的叠加 PR）；PR 永远不部署
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: 用真实 Python 验证题目答案
        run: npm run verify:content
      - run: npm run build
      - name: 自动测试（不通过就不部署）
        run: npm test
      - name: 上传发布文件（只有 main 上传）
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  mobile:
    # 手机模拟测试：WebKit（Safari 内核）和 Chromium 两个内核都必须通过，PR 必跑，也是部署前提。
    # 是 Playwright 模拟，不等于 iOS 真机 / 微信 / iPad；不测 VoiceOver。
    # 依赖功能缺失 → 测试失败；浏览器装不上或起不来 → “环境失败”（同样是失败，不会当作通过）。不使用 continue-on-error。
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit, chromium]
    name: mobile (${{ matrix.browser }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 安装浏览器和系统依赖
        id: install
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run build
      - name: 手机模拟测试（${{ matrix.browser }}）
        id: mobile
        run: npm run test:mobile -- ${{ matrix.browser }}
      - name: 端到端关键流程（${{ matrix.browser }}）：开场 → 打开课程 → 运行 Python → 答题保存 → 刷新恢复
        id: e2e
        run: npm run test:e2e -- ${{ matrix.browser }}
      - name: 报告环境失败
        if: failure() && steps.install.outcome == 'failure'
        run: echo "::error title=环境失败::${{ matrix.browser }} 安装失败，这不是测试通过" && exit 1
  deploy:
    needs: [build, mobile]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
