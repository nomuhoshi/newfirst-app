# 检查与发布（GitHub Pages：Settings → Pages 的 Source 为 GitHub Actions）。
# - 任何 PR（不限 base 分支）和推送 main：安装 → 构建 → 自动测试。PR 只检查，不部署、不需要部署权限。
# - 只有推送 main（或在 main 上手动运行）且测试通过后，才发布。
# - PR 的重复运行可以互相取消；main 的运行和部署永远不会被取消。
name: Test and deploy
on:
  push:
    branches: [main]
  pull_request:       # 所有 PR 都跑（含 base 不是 main 的叠加 PR）；只有推送 main 才会部署
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: 自动测试（不通过就不部署）
        run: npm test
      - name: 上传发布文件（PR 不上传）
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  mobile:
    permissions:
      contents: write
    # 手机模拟测试：WebKit（Safari 内核）和 Chromium 两个内核都必须通过，PR 必跑，也是部署前提。
    # 是 Playwright 模拟，不等于 iOS 真机 / 微信 / iPad；不测 VoiceOver。
    # 依赖功能缺失 → 测试失败；浏览器装不上或起不来 → “环境失败”（同样是失败，不会当作通过）。不使用 continue-on-error。
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit, chromium]
    name: mobile (${{ matrix.browser }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 安装浏览器和系统依赖
        id: install
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run build
      - name: 手机模拟测试（${{ matrix.browser }}）
        id: mobile
        run: npm run test:mobile -- ${{ matrix.browser }}
        env:
          SHOTS_DIR: ${{ github.workspace }}/shots
      - name: 上传代码题页面截图（产物，7 天）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens-${{ matrix.browser }}
          path: shots
          if-no-files-found: ignore
          retention-days: 7
      - name: 把截图推到 ci-screenshots-${{ matrix.browser }} 分支（仅本仓库的 PR；只供查看，可随时删除）
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && hashFiles('shots/*.png') != ''
        run: |
          cd shots
          git init -q -b shots && git config user.name "ci" && git config user.email "ci@users.noreply.github.com"
          echo "${{ github.event.pull_request.head.sha }}" > SOURCE_SHA.txt
          git add -A && git commit -q -m "screenshots for ${{ github.event.pull_request.head.sha }} (${{ matrix.browser }})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" shots:ci-screenshots-${{ matrix.browser }}
      - name: 报告环境失败
        if: failure() && steps.install.outcome == 'failure'
        run: echo "::error title=环境失败::${{ matrix.browser }} 安装失败，这不是测试通过" && exit 1
  deploy:
    needs: [build, mobile]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  # 设计预览构建：只给本仓库的 design/* PR 用。把构建产物推到分支 preview-dist-design-v2（供拷进独立的预览仓库），不部署任何站点。
  # 缓存名前缀与正式站不同（suipian-preview-v2-），预览不会删除或污染正式站的离线缓存。
  preview-build:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'design/') && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 构建预览（带“设计预览”标记和独立缓存名）
        run: npm run build
        env:
          SW_PREFIX: suipian-preview-v2-
          PREVIEW_LABEL: 设计预览
      - name: 推到 preview-dist-design-v2 分支
        run: |
          cd dist
          git init -q -b dist && git config user.name "ci" && git config user.email "ci@users.noreply.github.com"
          echo "${{ github.event.pull_request.head.sha }}" > SOURCE_SHA.txt
          git add -A && git commit -q -m "preview build for ${{ github.event.pull_request.head.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" dist:preview-dist-design-v2
