# 检查与发布（GitHub Pages：Settings → Pages 的 Source 为 GitHub Actions）。
# - 任何 PR（不限 base 分支）和推送 main：安装 → 构建 → 自动测试。PR 只检查，不部署、不需要部署权限。
# - 只有推送 main（或在 main 上手动运行）且测试通过后，才发布。
# - PR 的重复运行可以互相取消；main 的运行和部署永远不会被取消。
name: Test and deploy
on:
  push:
    branches: [main]
  pull_request:       # 所有 PR 都跑（含 base 不是 main 的叠加 PR）；只有推送 main 才会部署
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: 自动测试（不通过就不部署）
        run: npm test
      - name: 上传发布文件（PR 不上传）
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
