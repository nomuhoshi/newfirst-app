# 正式版候选 rc-1 的独立预览入口：用 PREVIEW_ID=rc1 构建（本地存储键前缀 rc1:、缓存前缀 rc1-suipian-），推到分支 preview-dist-rc1。
# 只在 preview/rc-1 分支运行（源码与 release/rc-1 相同，只多这个工作流文件）；不部署任何网站、不碰正式版。产物由人工复制到预览仓库 newfirst-app-preview 的 rc1/ 目录。
name: RC1 preview
on:
  push:
    branches: [preview/rc-1]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rc1-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 构建（云端只连独立的测试 Supabase 项目；没配置就关闭云端，永远不连正式项目）
        env:
          PREVIEW_ID: rc1
          TEST_SUPABASE_URL: ${{ vars.TEST_SUPABASE_URL }}
          TEST_SUPABASE_ANON_KEY: ${{ vars.TEST_SUPABASE_ANON_KEY }}
        run: npm run build
      - name: 记录这次构建的云端模式（只看有没有配置，不打印密钥）
        run: |
          if [ -n "${{ vars.TEST_SUPABASE_URL }}" ] && [ -n "${{ vars.TEST_SUPABASE_ANON_KEY }}" ]; then echo "云端：已配置独立测试项目"; else echo "云端：未配置 → 本次构建云端关闭（只能在本机学习）"; fi
      - name: 检查隔离：构建里有 rc1 前缀、缓存前缀不是 suipian-
        run: |
          grep -q 'PREFIX = "rc1-suipian-"' dist/sw.js
          grep -rq 'rc1' dist/assets/main-*.js
      - name: 推到 preview-dist-rc1
        run: |
          cd dist
          git init -q -b dist && git config user.name "ci" && git config user.email "ci@users.noreply.github.com"
          echo "${{ github.sha }}" > SOURCE_SHA.txt
          git add -A && git commit -q -m "rc1 test entry from ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" dist:preview-dist-rc1
