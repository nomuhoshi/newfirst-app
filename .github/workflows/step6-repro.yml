# 临时：复现 step6 随机练习测试的偶发失败（只在 fix/step6-flaky 分支运行；查完会删）。
name: Step6 repro
on:
  push:
    branches: [fix/step6-flaky]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: 重复跑 step6 20 次，收集失败现场
        run: |
          fails=0
          for i in $(seq 1 20); do
            node tests/step6.test.mjs > /tmp/step6-$i.log 2>&1 || { fails=$((fails+1)); echo "=== 第 $i 次失败 ==="; grep -E "❌|⚠️|TimeoutError|at .*step6" /tmp/step6-$i.log | cut -c1-1500; }
          done
          echo "20 次里失败 $fails 次"
