# 实验预览“闪电 5 题”：构建（EXP=quick）→ 自动测试 → 产物推到 preview-dist-exp-quick、截图推到 ci-screenshots-exp-quick。不部署网站、不碰正式版。
name: Exp quick preview
on:
  push:
    branches: [exp/quick-drill]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: exp-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:exp
      - name: 预览自动测试（地图 → 进题 → 提交 → 反馈 → 回地图，浅色+深色）
        run: npm run test:exp
        env:
          SHOTS_DIR: ${{ github.workspace }}/shots
      - name: 截图推到 ci-screenshots-exp-quick（只供查看）
        if: always() && hashFiles('shots/*.png') != ''
        run: |
          cd shots
          git init -q -b shots && git config user.name "ci" && git config user.email "ci@users.noreply.github.com"
          echo "${{ github.sha }}" > SOURCE_SHA.txt
          git add -A && git commit -q -m "exp-quick screenshots for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" shots:ci-screenshots-exp-quick
      - name: 测试通过后，把构建产物推到 preview-dist-exp3
        if: success()
        run: |
          cd dist-exp
          git init -q -b dist && git config user.name "ci" && git config user.email "ci@users.noreply.github.com"
          echo "${{ github.sha }}" > SOURCE_SHA.txt
          git add -A && git commit -q -m "exp-quick preview build from ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" dist:preview-dist-exp3
