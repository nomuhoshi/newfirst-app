  </g>
  <g class="off" color="#2b3a55" transform="translate(60 0)">
    <path class="glass" d="M30 4C18 4 12 14 12 26c0 8 4 14 8 17v4h20v-4c4-3 8-9 8-17C48 14 42 4 30 4Z"/>
    <path class="fil" d="M24 44V30l6-8 6 8v14"/>
