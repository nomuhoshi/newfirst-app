<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>登录 / 注册 · 编程实验室</title><link rel="stylesheet" href="base.css"><style>
.back{position:absolute;inset:47px 0 0;overflow:hidden;pointer-events:none}
.back .hud{display:flex;align-items:center;gap:8px;padding:6px 16px 10px}
.back .brand{margin-right:auto;display:flex;align-items:center;gap:8px;font:800 17px/1 var(--font)}
.back .brand svg{width:22px;height:30px}
.back .chip{padding:0 10px}.back .chip svg{width:16px;height:16px}
.c-streak svg{color:var(--copper)}.c-xp svg{color:var(--glow)}
.hero{margin:0 16px;background:var(--navy);color:var(--on-navy);border-radius:20px;padding:16px 18px;border:1.5px solid var(--navy-2)}
.dark .hero{border-color:rgba(232,147,90,.55)}
.hero .eyebrow{font:800 13px/1 var(--font);letter-spacing:1px;color:var(--filament)}
.hero h2{margin:8px 0 2px;font:800 28px/1.25 var(--font)}
.hero p{color:var(--on-navy-muted);font:400 15px/1.5 var(--font)}
.unit{margin:16px 20px 0;font:800 13px/1 var(--font);letter-spacing:1px;color:var(--copper-text)}
.unit b{display:block;margin-top:6px;font:800 22px/1.3 var(--font);color:var(--ink);letter-spacing:0}
.row{display:flex;align-items:center;gap:14px;margin:14px 20px 0;color:var(--muted)}
.pad{width:46px;height:46px;border-radius:50%;background:var(--trace-on);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 5px var(--bg)}
.pad svg{width:20px;height:20px}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-top:1.5px solid var(--line);border-radius:24px 24px 0 0;padding:10px 20px 34px;display:flex;flex-direction:column;gap:0;max-height:calc(100% - 56px);box-shadow:0 -8px 32px rgba(13,19,34,.18)}
.grab{width:36px;height:4px;border-radius:2px;background:var(--muted);opacity:.45;margin:2px auto 12px}
.sheet h1{margin:0 0 8px}
.desc{margin:0 0 16px}
.field{width:100%;height:52px;border-radius:var(--r-m);border:1.5px solid var(--line-strong);background:var(--bg);color:var(--ink);font:600 17px/1 var(--font);padding:0 16px;margin:0 0 8px;outline:none}
.field:focus{border-color:var(--copper);box-shadow:0 0 0 3px var(--copper-soft)}
.field.code{font:800 22px/1 var(--mono);letter-spacing:8px;text-align:center;padding:0 12px}
.hint{min-height:0;margin:0 0 16px}
.sheet .btn{margin-top:4px}
.sheet .btn-ghost{margin-top:8px}
.sent{margin:0 0 16px}
.actions{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.code-step{display:none}
.step-code .email-step{display:none}
.step-code .code-step{display:flex;flex-direction:column}
.resend{height:44px;display:flex;align-items:center;justify-content:center;font:800 15px/1 var(--font);color:var(--muted)}
</style></head><body>
<div class="screen">
 <div class="ios"><span>9:41</span><i></i></div>
 <div class="back">
  <div class="hud"><span class="brand"><svg class="tube" style="width:22px;height:30px"><use href="#tube-on"/></svg></span>
   <span class="chip c-streak"><svg><use href="#i-flame"/></svg>3 天</span>
   <span class="chip c-xp"><svg><use href="#i-bolt"/></svg>120 XP</span>
   <span class="chip" data-tubes="4"></span>
  </div>
  <div class="hero"><div class="eyebrow">继续学习 · 第 1 单元 第 3 关</div><h2>顾客改单</h2><p>用变量记下改单，再算价格。</p></div>
  <div class="unit">UNIT 01<b>奶茶店点单屏</b></div>
  <div class="row"><span class="pad"><svg><use href="#i-check"/></svg></span><span class="t-body" style="color:var(--muted)">让屏幕说话</span></div>
 </div>
 <div class="scrim" aria-hidden="true"></div>
 <div class="sheet" role="dialog" aria-labelledby="login-title">
  <div class="grab"></div>
  <div class="email-step">
   <h1 class="t-title" id="login-title">登录 / 注册</h1>
   <p class="t-sub muted desc">用邮箱登录，换手机或 iPad 也能接着学。没有账号会自动创建；不用设密码。</p>
   <input class="field" type="email" value="name@example.com" placeholder="name@example.com" aria-label="邮箱" readonly>
   <p class="t-cap muted hint">验证码会发到这个邮箱，不用设密码。</p>
   <button class="btn btn-primary">发送验证码</button>
   <button class="btn btn-ghost">先不登录</button>
  </div>
  <div class="code-step">
   <h1 class="t-title">输入验证码</h1>
   <p class="t-sub muted sent">验证码已发到 name@example.com。没收到？看看垃圾邮件，或稍等再重新发送。</p>
   <input class="field code" type="text" placeholder="验证码" aria-label="邮箱验证码" readonly>
   <div class="actions">
    <button class="btn btn-primary">登录</button>
    <div class="resend">重新发送（60 秒）</div>
    <button class="btn btn-ghost">换个邮箱</button>
   </div>
  </div>
 </div>
</div>
<script src="common.js"></script>
<script>if (location.hash.includes("code")) document.body.classList.add("step-code");</script>
</body></html>
